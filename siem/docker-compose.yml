# Passo [2] — Wazuh single-node (indexer + manager + dashboard).
# Sobe com: docker compose -f siem/docker-compose.yml up -d
# Primeira subida baixa ~2GB e leva minutos. Dashboard em https://localhost (admin/admin).
# Dica: Wazuh come RAM. Se travar, sobe só indexer+manager primeiro (dashboard depois).
services:
  wazuh-indexer:
    image: wazuh/wazuh-indexer:4.7.2
    container_name: wazuh-indexer
    environment:
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
      - "discovery.type=single-node"
      - "cluster.name=wazuh-cluster"
      - "node.name=wazuh-indexer"
      - "plugins.security.disabled=true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - wazuh-indexer-data:/var/lib/wazuh-indexer
    ports:
      - "9200:9200"
    networks:
      - wazuh

  wazuh-manager:
    image: wazuh/wazuh-manager:4.7.2
    container_name: wazuh-manager
    environment:
      - "INDEXER_URL=https://wazuh-indexer:9200"
      - "INDEXER_USERNAME=admin"
      - "INDEXER_PASSWORD=admin"
      - "FILEBEAT_SSL_VERIFICATION_MODE=none"
    volumes:
      - wazuh-manager-etc:/var/ossec/etc
      - wazuh-manager-logs:/var/ossec/logs
      - wazuh-manager-queue:/var/ossec/queue
      # Regras custom do Projeto 1 (mount 1:1 p/ rules/ ler automatico; subdir NAO e lido)
      - ./custom_rules/bruteforce_custom.xml:/var/ossec/etc/rules/bruteforce_custom.xml:ro
      # Logs do honeypot (passo [3]: manager lê direto, sem Filebeat no meio)
      - ../honeypot/logs:/var/log/honeypot:ro
    ports:
      - "1514:1514"
      - "1514:1514/udp"
      - "1515:1515"
      - "55000:55000"
    depends_on:
      - wazuh-indexer
    networks:
      - wazuh

  wazuh-dashboard:
    image: wazuh/wazuh-dashboard:4.7.2
    container_name: wazuh-dashboard
    environment:
      - "INDEXER_USERNAME=admin"
      - "INDEXER_PASSWORD=admin"
      - "WAZUH_API_URL=https://wazuh-manager"
      - "API_USERNAME=wazuh-wui"
      - "API_PASSWORD=MyS3cr37P450r.*-"
    ports:
      - "5601:5601"  # 443 e 8443 ocupadas neste host; dashboard em https://localhost:5601
    depends_on:
      - wazuh-indexer
      - wazuh-manager
    networks:
      - wazuh

volumes:
  wazuh-indexer-data:
  wazuh-manager-etc:
  wazuh-manager-logs:
  wazuh-manager-queue:

networks:
  wazuh:
    driver: bridge
