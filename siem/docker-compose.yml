# Wazuh single-node do Purple Honeypot SIEM (indexer + manager + dashboard).
# Suba com: docker compose -f siem/docker-compose.yml up -d
# A primeira subida baixa cerca de 2 GB e pode levar alguns minutos.
# O Wazuh consome RAM; se necessário, suba primeiro indexer + manager e depois o dashboard.
services:
  wazuh-indexer:
    image: wazuh/wazuh-indexer:4.7.2
    container_name: wazuh-indexer
    environment:
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
      - "discovery.type=single-node"
      - "cluster.name=wazuh-cluster"
      - "node.name=wazuh-indexer"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - wazuh-indexer-data:/var/lib/wazuh-indexer
    ports:
      - "9200:9200"
    networks:
      wazuh:
        aliases:
          # O dashboard oficial procura "wazuh.indexer" (com ponto).
          - wazuh.indexer

  wazuh-manager:
    image: wazuh/wazuh-manager:4.7.2
    container_name: wazuh-manager
    environment:
      - "INDEXER_URL=https://wazuh-indexer:9200"
      - "INDEXER_USERNAME=admin"
      - "INDEXER_PASSWORD=admin"
      - "FILEBEAT_SSL_VERIFICATION_MODE=none"
    volumes:
      - wazuh-manager-etc:/var/ossec/etc
      - wazuh-manager-logs:/var/ossec/logs
      - wazuh-manager-queue:/var/ossec/queue
      # Regras custom do Purple Honeypot SIEM (montagem 1:1 para o rules/ ler automaticamente; subdiretórios não são lidos)
      - ./custom_rules/bruteforce_custom.xml:/var/ossec/etc/rules/bruteforce_custom.xml:ro
      # Logs dos honeypots (o manager lê diretamente, sem Filebeat no meio)
      - ../honeypot/logs:/var/log/honeypot:ro
    ports:
      - "1514:1514"
      - "1514:1514/udp"
      - "1515:1515"
      - "55000:55000"
    depends_on:
      - wazuh-indexer
    networks:
      - wazuh

  wazuh-dashboard:
    image: wazuh/wazuh-dashboard:4.7.2
    container_name: wazuh-dashboard
    environment:
      - "INDEXER_USERNAME=admin"
      - "INDEXER_PASSWORD=admin"
      - "WAZUH_API_URL=https://wazuh-manager"
      # Usuários padrão do manager neste volume (não são os do compose oficial).
      - "API_USERNAME=wazuh-wui"
      - "API_PASSWORD=wazuh-wui"
    ports:
      - "5601:5601"  # 443 e 8443 já estavam ocupadas no host; dashboard em https://localhost:5601
    depends_on:
      - wazuh-indexer
      - wazuh-manager
    networks:
      - wazuh

volumes:
  wazuh-indexer-data:
  wazuh-manager-etc:
  wazuh-manager-logs:
  wazuh-manager-queue:

networks:
  wazuh:
    driver: bridge
